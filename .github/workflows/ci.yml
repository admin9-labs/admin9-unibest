name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAPI_SCHEMA_PATH: ./admin9-api-laravel/docs/api.json
    steps:
      - name: Checkout application
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      - name: Checkout API contract
        uses: actions/checkout@v7
        with:
          repository: admin9-labs/admin9-api-laravel
          ref: 989a15c0dca4ff390ba2a792a00a6ff1557b0d15
          path: admin9-api-laravel

      - name: Check OpenAPI drift
        run: pnpm openapi:check

      - name: Build H5
        run: pnpm build:h5

      - name: Build WeChat Mini Program
        env:
          SKIP_OPEN_DEVTOOLS: 'true'
        run: pnpm build:mp
